<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>MEDSAVE - Your Health Comes First</title>

    <!-- Bootstrap & FontAwesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="index.css" />
    <style>
        .video-background {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            object-fit: cover;
        }
        .hero-content {
            text-align: left;
            max-width: 600px;
            margin-left: 0;
            position: relative;
            z-index: 1;
        }
        .login-btn {
            background-color: #0d6efd;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }
        .login-btn:hover {
            background-color: #0b5ed7;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            color: white;
        }
        .card-medsave {
            margin-left: 0;
            margin-right: auto;
        }
        .hero-title {
            color: #0d6efd;
            font-weight: bold;
        }
        .hero-subtitle {
            color: white;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .hero-subtitle:hover {
            color: #0d6efd;
            transform: scale(1.02);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        body {
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
        }
        main {
            position: relative;
            z-index: 1;
        }
        .btn-medsave {
            background-color: #ff6b00;
            color: white;
            padding: 10px 30px;
            border: none;
            border-radius: 25px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        .btn-medsave:hover {
            background-color: #e05e00;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            color: white;
        }
        .rate-star {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 2.5rem;
            color: #28a745;
            text-decoration: none;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        .rate-star:hover {
            transform: scale(1.2);
            color: #218838;
        }
    </style>
</head>
<body>
    <!-- Video Background -->
    <video autoplay muted loop class="video-background">
        <source src="Video 1.mp4" type="video/mp4" />
    </video>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark bg-opacity-75">
        <div class="container">
            <a class="navbar-brand" href="#" style="color: red;">
                 MEDSAVE
            </a>
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="sevices.html">Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
                </ul>
                <a href="help.html" class="btn-medsave me-2" data-bs-toggle="tooltip" title="Get Help">
                    GET HELP
                </a>
                <form class="d-flex" action="search.html" method="GET">
                    <input class="form-control me-2" type="search" name="q" placeholder="Search MEDSAVE">
                    <button class="btn btn-outline-light" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Main Section -->
    <main class="container py-5">
        <section class="page-container active" id="home-page">
            <div class="row">
                <div class="col-lg-8">
                    <div class="hero-content">
                        <h1 class="display-4 fw-bold mb-4 hero-title">YOUR HEALTH COMES FIRST</h1>
                        <p class="lead mb-4 hero-subtitle">Book your medical appointment with us quickly and easily.</p>
                        <div class="d-flex gap-3">
                            <a href="login.html" class="login-btn">Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Rate Us Star -->
    <a href="rate.html" class="rate-star" title="Rate Us">
        <i class="fas fa-star"></i>
    </a>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5 style="color: red;">MEDSAVE</h5>
                    <p>Your trusted partner in healthcare services.</p>
                    <a href="https://www.medsave.com" class="text-white"></a>
                </div>
                <div class="col-md-6 text-md-end">
                    <p>&copy; 2025 MEDSAVE. All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
