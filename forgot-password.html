<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | MEDSAVE</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        .video-background {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            object-fit: cover;
        }
        .forgot-password-form {
            max-width: 500px;
            margin: 30px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            backdrop-filter: blur(5px);
        }
        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .form-header i {
            font-size: 48px;
            color: #0d6efd;
            margin-bottom: 15px;
        }
        .btn-medsave {
            background-color: #ff6b00;
            color: white;
            padding: 10px 30px;
            border: none;
            border-radius: 25px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            width: 100%;
        }
        .btn-medsave:hover {
            background-color: #e05e00;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            color: white;
        }
        .form-control {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-bottom: 15px;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
            border-color: #0d6efd;
        }
        .back-to-login {
            text-align: center;
            margin-top: 20px;
        }
        .back-to-login a {
            color: #0d6efd;
            text-decoration: none;
            font-weight: bold;
        }
        .back-to-login a:hover {
            text-decoration: underline;
        }
        .user-type-toggle {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            gap: 20px;
        }
        .user-type-btn {
            padding: 10px 20px;
            border: 2px solid #0d6efd;
            border-radius: 25px;
            background: transparent;
            color: #0d6efd;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .user-type-btn.active {
            background: #0d6efd;
            color: white;
        }
        .user-type-btn:hover {
            background: #0d6efd;
            color: white;
        }
        .user-icon {
            font-size: 48px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        .patient-icon {
            color: #0d6efd;
        }
        .doctor-icon {
            color: #198754;
        }
    </style>
</head>
<body>
    <!-- Video Background -->
    <video autoplay muted loop class="video-background">
        <source src="Video 1.mp4" type="video/mp4" />
    </video>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark bg-opacity-75">
        <div class="container">
            <a class="navbar-brand" href="index.html" style="color: red;">
                 MEDSAVE
            </a>
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="sevices.html">Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
                </ul>
                <a href="help.html" class="btn-medsave me-2" data-bs-toggle="tooltip" title="Get Help">
                    GET HELP
                </a>
                <form class="d-flex" action="search.php" method="GET">
                    <input class="form-control me-2" type="search" name="q" placeholder="Search MEDSAVE">
                    <button class="btn btn-outline-light" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Forgot Password Form Section -->
    <div class="container">
        <div class="forgot-password-form">
            <div class="form-header">
                <i class="fas fa-key user-icon patient-icon" id="userIcon"></i>
                <h2>Forgot Password</h2>
                <p class="text-muted">Enter your email to reset your password</p>
            </div>

            <div class="user-type-toggle">
                <button type="button" class="user-type-btn active" data-type="patient">Patient</button>
                <button type="button" class="user-type-btn" data-type="doctor">Doctor</button>
            </div>

            <form id="resetForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" required>
                </div>

                <button type="submit" class="btn-medsave">Reset Password</button>

                <div class="back-to-login">
                    Remember your password? <a href="login.html">Back to Login</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5 style="color: red;">MEDSAVE</h5>
                    <p>Your trusted partner in healthcare services.</p>
                    <a href="https://www.medsave.com" class="text-white"></a>
                </div>
                <div class="col-md-6 text-md-end">
                    <p>&copy; 2025 MEDSAVE. All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // User type toggle functionality
        const userTypeBtns = document.querySelectorAll('.user-type-btn');
        const userIcon = document.getElementById('userIcon');
        let currentUserType = 'patient';

        userTypeBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                // Remove active class from all buttons
                userTypeBtns.forEach(b => b.classList.remove('active'));
                // Add active class to clicked button
                this.classList.add('active');
                
                // Update user type and icon
                currentUserType = this.dataset.type;
                if (currentUserType === 'patient') {
                    userIcon.className = 'fas fa-key user-icon patient-icon';
                } else {
                    userIcon.className = 'fas fa-key user-icon doctor-icon';
                }
            });
        });

        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const userType = document.querySelector('input[name="userType"]:checked').value;

            try {
                const response = await fetch('api/auth.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        action: 'reset_password',
                        email: email,
                        user_type: userType
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    alert(data.message);
                    window.location.href = 'login.html';
                } else {
                    alert(data.message || 'Password reset failed. Please try again.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred. Please try again.');
            }
        });
    </script>
</body>
</html>
