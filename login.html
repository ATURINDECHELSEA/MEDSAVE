<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MEDSAVE</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        .video-background {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            object-fit: cover;
        }
        .login-form {
            max-width: 500px;
            margin: 30px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            backdrop-filter: blur(5px);
        }
        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .form-header i {
            font-size: 48px;
            color: #0d6efd;
            margin-bottom: 15px;
        }
        .btn-medsave {
            background-color: #ff6b00;
            color: white;
            padding: 10px 30px;
            border: none;
            border-radius: 25px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        .btn-medsave:hover {
            background-color: #e05e00;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            color: white;
        }
        .form-control {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-bottom: 15px;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
            border-color: #0d6efd;
        }
        .forgot-password {
            text-align: right;
            margin-bottom: 20px;
        }
        .forgot-password a {
            color: #0d6efd;
            text-decoration: none;
        }
        .forgot-password a:hover {
            text-decoration: underline;
        }
        .signup-link {
            text-align: center;
            margin-top: 20px;
        }
        .signup-link a {
            color: #0d6efd;
            text-decoration: none;
            font-weight: bold;
        }
        .signup-link a:hover {
            text-decoration: underline;
        }
        .rate-star {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 2.5rem;
            color: #28a745;
            text-decoration: none;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        .rate-star:hover {
            transform: scale(1.2);
            color: #218838;
        }
        .user-type-toggle {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            gap: 20px;
        }
        .user-type-btn {
            padding: 10px 20px;
            border: 2px solid #0d6efd;
            border-radius: 25px;
            background: transparent;
            color: #0d6efd;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .user-type-btn.active {
            background: #0d6efd;
            color: white;
        }
        .user-type-btn:hover {
            background: #0d6efd;
            color: white;
        }
        .user-icon {
            font-size: 48px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        .patient-icon {
            color: #0d6efd;
        }
        .doctor-icon {
            color: #198754;
        }
    </style>
</head>
<body>
    <!-- Video Background -->
    <video autoplay muted loop class="video-background">
        <source src="Video 1.mp4" type="video/mp4" />
    </video>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark bg-opacity-75">
        <div class="container">
            <a class="navbar-brand" href="index.html" style="color: red;">
                 MEDSAVE
            </a>
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="sevices.html">Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
                </ul>
                <a href="help.html" class="btn-medsave me-2" data-bs-toggle="tooltip" title="Get Help">
                    GET HELP
                </a>
                <form class="d-flex" action="search.html" method="GET">
                    <input class="form-control me-2" type="search" name="q" placeholder="Search MEDSAVE">
                    <button class="btn btn-outline-light" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Login Form Section -->
    <div class="container">
        <div class="login-form">
            <div class="form-header">
                <i class="fas fa-user-circle user-icon patient-icon" id="userIcon"></i>
                <h2>Welcome Back</h2>
                <p class="text-muted">Please login to your account</p>
            </div>

            <div class="user-type-toggle">
                <button type="button" class="user-type-btn active" data-type="patient">Patient Login</button>
                <button type="button" class="user-type-btn" data-type="doctor">Doctor Login</button>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required>
                </div>

                <div class="mb-3 text-end">
                    <a href="forgot-password.html" class="text-decoration-none">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-medsave">Login</button>

                <div class="text-center mt-3">
                    Don't have an account? <a href="signup.html" class="text-decoration-none">Sign up</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Rate Us Star -->
    <a href="rate.html" class="rate-star" title="Rate Us">
        <i class="fas fa-star"></i>
    </a>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5 style="color: red;">MEDSAVE</h5>
                    <p>Your trusted partner in healthcare services.</p>
                    <a href="https://www.medsave.com" class="text-white"></a>
                </div>
                <div class="col-md-6 text-md-end">
                    <p>&copy; 2025 MEDSAVE. All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // User type toggle functionality
        const userTypeBtns = document.querySelectorAll('.user-type-btn');
        const userIcon = document.getElementById('userIcon');
        let currentUserType = 'patient';

        userTypeBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                // Remove active class from all buttons
                userTypeBtns.forEach(b => b.classList.remove('active'));
                // Add active class to clicked button
                this.classList.add('active');
                
                // Update user type and icon
                currentUserType = this.dataset.type;
                if (currentUserType === 'patient') {
                    userIcon.className = 'fas fa-user-circle user-icon patient-icon';
                } else {
                    userIcon.className = 'fas fa-user-md user-icon doctor-icon';
                }
            });
        });

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const userType = currentUserType; // Use the currentUserType from the toggle

            // For demo purposes, we'll use simple validation
            // In a real application, this would be handled by a backend server
            if (email && password) {
                // Show success message
                const successAlert = document.createElement('div');
                successAlert.className = 'alert alert-success alert-dismissible fade show';
                successAlert.innerHTML = `
                    Login successful! Redirecting...
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                `;
                document.getElementById('loginForm').insertAdjacentElement('beforebegin', successAlert);

                // Redirect based on user type
                setTimeout(() => {
                    if (userType === 'doctor') {
                        window.location.href = 'doctor-dashboard.html';
                    } else {
                        window.location.href = 'patient-dashboard.html';
                    }
                }, 1500);
            } else {
                alert('Please fill in all fields');
            }
        });
    </script>
</body>
</html>
