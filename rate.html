<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rate Us | MEDSAVE</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    .rating-form {
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .form-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .form-header i {
      font-size: 48px;
      color: #ffc107;
      margin-bottom: 15px;
    }
    .btn-medsave {
      background-color: #ff6b00;
      color: white;
      padding: 10px 30px;
      border: none;
      border-radius: 25px;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }
    .btn-medsave:hover {
      background-color: #e05e00;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      color: white;
    }
    .star-rating {
      font-size: 2rem;
      color: #ddd;
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .star-rating:hover,
    .star-rating.active {
      color: #ffc107;
    }
    .video-background {
      position: fixed;
      right: 0;
      bottom: 0;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      z-index: -1;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <video autoplay muted loop class="video-background">
    <source src="Video 1.mp4" type="video/mp4" />
  </video>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark bg-opacity-75">
    <div class="container">
      <a class="navbar-brand" href="index.html" style="color: red;">
        MEDSAVE
      </a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
          <li class="nav-item"><a class="nav-link" href="sevices.html">Services</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
        </ul>
        <a href="help.html" class="btn-medsave me-2" data-bs-toggle="tooltip" title="Get Help">
          GET HELP
        </a>
        <form class="d-flex" action="search.php" method="GET">
          <input class="form-control me-2" type="search" name="q" placeholder="Search MEDSAVE">
          <button class="btn btn-outline-light" type="submit">Search</button>
        </form>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="rating-form">
      <div class="form-header">
        <i class="fas fa-star"></i>
        <h2>Rate Your Experience</h2>
        <p class="text-muted">We value your feedback!</p>
      </div>

      <form id="ratingForm">
        <div class="mb-3">
          <label for="name" class="form-label">Your Name</label>
          <input type="text" class="form-control" id="name" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Rate your experience</label>
          <div class="star-rating-container">
            <i class="fas fa-star star-rating" data-rating="1"></i>
            <i class="fas fa-star star-rating" data-rating="2"></i>
            <i class="fas fa-star star-rating" data-rating="3"></i>
            <i class="fas fa-star star-rating" data-rating="4"></i>
            <i class="fas fa-star star-rating" data-rating="5"></i>
          </div>
        </div>

        <div class="mb-3">
          <label for="feedback" class="form-label">Your Feedback</label>
          <textarea class="form-control" id="feedback" rows="4" required></textarea>
        </div>

        <div class="text-center">
          <button type="submit" class="btn-medsave">Submit Rating</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="bg-dark text-white py-4">
    <div class="container">
      <div class="row">
        <div class="col-md-6">
          <h5 style="color: red;">MEDSAVE</h5>
          <p>Your trusted partner in healthcare services.</p>
          <a href="https://www.medsave.com" class="text-white"></a>
        </div>
        <div class="col-md-6 text-md-end">
          <p>&copy; 2025 MEDSAVE. All rights reserved.</p>
        </div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Star rating functionality
    const stars = document.querySelectorAll('.star-rating');
    let selectedRating = 0;

    stars.forEach(star => {
      star.addEventListener('mouseover', function() {
        const rating = this.dataset.rating;
        updateStars(rating);
      });

      star.addEventListener('mouseout', function() {
        updateStars(selectedRating);
      });

      star.addEventListener('click', function() {
        selectedRating = this.dataset.rating;
        updateStars(selectedRating);
      });
    });

    function updateStars(rating) {
      stars.forEach(star => {
        const starRating = star.dataset.rating;
        if (starRating <= rating) {
          star.classList.add('active');
        } else {
          star.classList.remove('active');
        }
      });
    }

    // Form submission
    document.getElementById('ratingForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      if (selectedRating === 0) {
        alert('Please select a rating');
        return;
      }

      // Show success message
      const successAlert = document.createElement('div');
      successAlert.className = 'alert alert-success alert-dismissible fade show';
      successAlert.innerHTML = `
        Thank you for your feedback!
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      `;
      this.insertAdjacentElement('beforebegin', successAlert);

      // Reset form
      this.reset();
      selectedRating = 0;
      updateStars(0);
    });
  </script>
</body>
</html>
