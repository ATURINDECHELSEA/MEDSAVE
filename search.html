        // Sample search data - in a real application, this would come from a database
        const searchData = {
            'doctor': {

                link: 'sevices.html#consultation'
            },
            'pharmacy': {

            },
            'lab': {

            'help': {

            },
            'login': {
                title: 'Login',
                description: 'Access your MEDSAVE account to manage appointments and prescriptions.',
                link: 'login.html'
            }
        };

        function performSearch() {
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q')?.toLowerCase() || '';
            const resultsContainer = document.getElementById('searchResults');
            
            if (!query) {
                resultsContainer.innerHTML = '<p>Please enter a search term.</p>';
                return;
            }

            const results = [];
            for (const [key, data] of Object.entries(searchData)) {
                if (key.includes(query) || 
                    data.title.toLowerCase().includes(query) || 
                    data.description.toLowerCase().includes(query)) {
                    results.push(data);
                }
            }

            if (results.length === 0) {
                resultsContainer.innerHTML = '<p>No results found. Please try a different search term.</p>';
                return;
            }

            resultsContainer.innerHTML = results.map(result => `
